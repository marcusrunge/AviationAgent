[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aviation-agent-training"
version = "2.0.0"
description = "Reproducible local training, evaluation, merge, and ONNX export pipeline for Aviation Agent V2"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Marcus Runge" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
